name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json and versions.json
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          MIN=$(node -p "require('./manifest.json').minAppVersion")
          VERSIONS=$(node -p "require('./versions.json')['${TAG}'] || ''")
          echo "tag=${TAG} manifest=${MANIFEST} versions.json[${TAG}]=${VERSIONS}"
          test "${TAG}" = "${MANIFEST}"
          test "${VERSIONS}" = "${MIN}"
          node --check main.js

      - name: Attest the plugin files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create the GitHub release
        run: |
          NOTES=$(awk -v v="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\[" v "\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" main.js styles.css manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "${NOTES:-See CHANGELOG.md}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
